aid: apiaddicts

name: apIAddicts

description: Fundación apIAddicts (API Addicts) is a Spain-based non-profit foundation and community of API and AI practitioners that has been
  connecting people and companies around APIs, MCP and AI since 2013. It runs the apIAddictsDay events (Spain and LATAM editions) and webinars,
  offers Spanish-language API training courses and official certification (API design, architecture, security, testing, APIOps, MCP), and publishes
  open source API tooling on GitHub, including Spectral style-guide rulesets for OpenAPI and AsyncAPI.

